name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Create Version
      shell: bash
      run: |
         ./scripts/versioning.sh major

    - name: Generate Summary
      env:
        VERSION: ${{ env.RELEASE_VERSION }}
      shell: bash  
      run: |
         git fetch --all --tags
         echo "Version....${VERSION}"
         PREVIOUS_VERSION=$(git tag --sort=-committerdate | head -2 | awk '{split($0, tags, "\n")} END {print tags[1]}')
         echo "Previous Version....${PREVIOUS_VERSION}"
         CHANGES=$(git log --oneline --pretty="- %s" $PREVIOUS_VERSION...$VERSION)
         echo ${CHANGES}
         printf "# 🎁 Release notes (\`$VERSION\`)\n\n## Changes\n$CHANGES\n\n" > release_notes.md     

    - name: Create Release
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
      run: |
         gh release create ${{ env.RELEASE_VERSION }} --notes-file release_notes.md
