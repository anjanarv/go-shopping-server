name: Release Tag
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Release name
        run: echo running on release ${GITHUB_REF##*/}
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
         context: .
         file: src/sampleserver/Dockerfile
         push: true
         tags: ${{ secrets.DOCKERHUB_USERNAME }}/sampleserver:${GITHUB_REF##*/}