name: Release Tag
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Release name
        shell: bash
        run: echo "::set-output name=release::${GITHUB_REF_NAME}"
        id: release
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
#      - name: Set up Docker Buildx
#        uses: docker/setup-buildx-action@v2
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
         context: .
         file: src/sampleserver/Dockerfile
         push: true
         tags: ${{ secrets.DOCKER_USER_NAME }}/sampleserver:${{ steps.release.outputs.release }}