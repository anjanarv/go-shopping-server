name: Release

on:
   push:
     tags:
         - '**'   


jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set env
      run: |
         echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - name: Summary
      run: |
         VERSION=$(git tag --sort=-committerdate | head -1)
         PREVIOUS_VERSION=$(git tag --sort=-committerdate | head -2 | awk '{split($0, tags, "\n")} END {print tags[1]}')
         CHANGES=$(git log --pretty="- %s" ${{ env.RELEASE_VERSION }}...$PREVIOUS_VERSION)
         printf "# 🎁 Release notes (\`$VERSION\`)\n\n## Changes\n$CHANGES\n\n## Metadata\n\`\`\`\nThis version -------- $VERSION\nPrevious version ---- $PREVIOUS_VERSION\nTotal commits ------- $(echo "$CHANGES" | wc -l)\n\`\`\`\n" > release_notes.md     

    - name: Release
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
      run: |
         gh release create ${{ env.RELEASE_VERSION }} --notes-file release_notes.md