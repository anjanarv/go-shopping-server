name: Release Tag
on:
#  release:
#    types: [published]
  push:
    tags:
     - sampleserver/v*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: 1.20
#      - name: Release name
#        shell: bash
#        run: echo "::set-output name=release::${GITHUB_REF_NAME | cut -d / -f 2}"
#        id: release
      - name: Release name
        id: release
        shell: bash
        run: echo ::set-output name=release::$(echo $GITHUB_REF_NAME | cut -d / -f 2)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: src/sampleserver/
          file: src/sampleserver/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER_NAME }}/sampleserver:${{ steps.release.outputs.release }}
      - name: Configure Git
        run: |
               git config user.name "$GITHUB_ACTOR"
               git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v1
        with:
          version: v3.8.1
      - name: custom packaging
        run: |
                  VERSION=${{steps.release.outputs.release}}
                  rm -rf .cr-release-packages
                  mkdir -p .cr-release-packages
                  helm package src/sampleserver/deployment --app-version=${VERSION:1} --version=${VERSION:1} --destination=.cr-release-packages
#      - name: upload artifacts
#        uses: actions/upload-artifact@v3
#        with:
#          name: cr-release-packages
#          path: .cr-release-packages
#      - name: Run chart-releaser
#        uses: helm/chart-releaser-action@v1.5.0
#        env:
#            CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ap-southeast-2
      - name: S3 upload
        uses: shallwefootball/s3-upload-action@master
        with:
              aws_key_id: ${{ secrets.AWS_KEY_ID }}
              aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
              aws_bucket: "s3://sampleserver-charts"
              source_dir: .cr-release-packages