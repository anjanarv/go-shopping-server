name: Release

on:
   push:
     tags:
         - '**'   


jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set env
      run: |
         echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    
    - name: Test
      run: |
         echo ${{ env.RELEASE_VERSION }}

    - name: Summary
      env:
        VERSION: ${{ env.RELEASE_VERSION }}
      run: |
         echo "Version....${VERSION}"
         PREVIOUS_VERSION=$(git tag --sort=-committerdate | head -2 | awk '{split($0, tags, "\n")} END {print tags[1]}')
         echo "Previous Version....${PREVIOUS_VERSION}"
         CHANGES=$(git log --pretty="- %s" $VERSION...$PREVIOUS_VERSION)
         echo ${CHANGES}
         printf "# 🎁 Release notes (\`$VERSION\`)\n\n## Changes\n$CHANGES\n\n" > release_notes.md     

    - name: Release
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN}}
      run: |
         gh release create ${{ env.RELEASE_VERSION }} --notes-file release_notes.md