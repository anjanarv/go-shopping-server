name: Caching Ex

on:
    pull_request:
      branches:
         - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/cache@v3
      id: cache
      with:
       path: test1
       key: release.yaml


  trigger-restore:
      needs: 
        - build
      uses: './.github/workflows/cache-restore.yaml'       