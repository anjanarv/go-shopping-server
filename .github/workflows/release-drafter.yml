  name: ci
  on:
    push:
      branches:
        - '**'
    pull_request:
      branches:
        - '**'
  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-go@v3
          with:
            go-version: 1.20
  #      - uses: golangci/golangci-lint-action@v3
    tagging:
      runs-on: ubuntu-latest
      steps:
        - name: tagging
          id: tag_pkg
          shell: bash
          run: |
            chmod +x ./tools/tag.sh
            ./tools/tag.sh
