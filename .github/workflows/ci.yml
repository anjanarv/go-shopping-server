  name: ci
  on:
    push:
      branches:
        - '**'
    pull_request:
      branches:
        - '**'
  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-go@v3
          with:
            go-version: 1.20
  #      - uses: golangci/golangci-lint-action@v3
    update_release_draft:
        needs: lint
        permissions:
          contents: write
          pull-requests: write
        runs-on: ubuntu-latest
        steps:
          - uses: release-drafter/release-drafter@v5
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
