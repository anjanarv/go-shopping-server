name: Caching restore

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/cache/restore@v3
      id: cache
      with:
       path: test1
       key: release-data


  trigger-restore:
      needs: 
        - build
      uses: './.github/workflows/cache-restore.yaml'       