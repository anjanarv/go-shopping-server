name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update charts
        shell: bash
        run: sh charts.sh
      - name: Create commits
        run: |
                  git add ../../deployment/values.yaml
                  git commit -m "Update values.yaml file during workflow"
      - uses: actions/setup-go@v3
        with:
          go-version: 1.20
      - uses: golangci/golangci-lint-action@v3


